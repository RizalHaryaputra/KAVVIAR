<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to KAVVIAR - Desa Wisata Krebet</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        /* PERBAIKAN UTAMA DISINI */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background-color: transparent; /* Jangan pakai warna hitam solid */
        }

        /* Video Background Styling - DIPERBAIKI */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Video full screen tidak gepeng */
            z-index: -1; /* Taruh di belakang */
        }

        /* Layer Hitam Transparan (Agar teks terbaca di atas video) */
        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Kegelapan 60% */
            z-index: 0;
        }

        /* Content Container */
        .hero-content {
            position: relative;
            z-index: 1; /* Konten di atas overlay */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        /* Typography */
        .title-main {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #f0f0f0;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
        }

        /* Tombol Mulai */
        .btn-start {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 500;
            color: white;
            background: transparent;
            border: 2px solid #FFD700;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.4s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-start:hover {
            background: #FFD700;
            color: #8B4513;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }

        @media (max-width: 768px) {
            .title-main { font-size: 2.5rem; }
            .subtitle { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bgVideo">
        <source src="videos/bgvideo.mp4" type="video/mp4">
        Browser Anda tidak mendukung video.
    </video>

    <div class="overlay-dark"></div>

    <div class="hero-content">
        <div class="animate__animated animate__fadeInDown">
            <h1 class="title-main">KAVVIAR</h1>
            <p class="subtitle">Krebet Arts Village Virtual Reality</p>
        </div>

        <div class="animate__animated animate__fadeInUp animate__delay-1s">
            <p class="mb-4 fs-5 d-none d-md-block">Jelajahi Keindahan Sentra Kerajinan Batik Kayu <br> Secara Virtual Dari Mana Saja</p>
            
            <a href="krebet-tour" class="btn-start">
                MULAI JELAJAH <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </div>

    <div style="position: absolute; bottom: 10px; width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 0.8rem; z-index: 2;">
        &copy; 2025 KAVVIAR Project
    </div>

</body>
</html>
