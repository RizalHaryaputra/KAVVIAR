<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin KAVVIAR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Admin Panel KAVVIAR</span>
            <button id="btnLogout" class="btn btn-danger btn-sm">Keluar</button>
        </div>
    </nav>

    <div class="container mt-4">
        <ul class="nav nav-tabs" id="adminTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-produk">Kelola Produk</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-berita">Kelola Berita</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-kesenian">Kelola Kesenian</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-kelompok">Kelompok Seni</button>
            </li>
        </ul>

        <div class="tab-content bg-white p-4 border border-top-0 rounded-bottom shadow-sm">

            <div class="tab-pane fade show active" id="tab-produk">
                <h4>Tambah Produk Baru</h4>
                <form id="formProduk">
                    <div class="mb-3">
                        <label>Nama Produk</label>
                        <input type="text" id="prodNama" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Harga (Rp)</label>
                        <input type="number" id="prodHarga" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Foto Produk</label>
                        <input type="file" id="prodFoto" class="form-control" accept="image/*" required>
                        <img id="previewProd" class="mt-2 d-none"
                            style="width: 100px; height: 100px; object-fit: cover;">
                    </div>
                    <div class="mb-3">
                        <label>Link WhatsApp (Format: 628...)</label>
                        <input type="text" id="prodWA" class="form-control" placeholder="628123456789">
                    </div>
                    <button type="submit" class="btn btn-success" id="btnSaveProd">
                        <i class="fa-solid fa-save"></i> Simpan Produk
                    </button>
                </form>
            </div>

            <div class="tab-pane fade" id="tab-berita">
                <h4>Tambah Berita Baru</h4>
                <form id="formBerita">
                    <div class="mb-3">
                        <label>Judul Berita</label>
                        <input type="text" id="newsJudul" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Foto Utama</label>
                        <input type="file" id="newsFoto" class="form-control" accept="image/*" required>
                    </div>
                    <div class="mb-3">
                        <label>Isi Berita</label>
                        <textarea id="newsIsi" class="form-control" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnSaveNews">
                        <i class="fa-solid fa-paper-plane"></i> Terbitkan Berita
                    </button>
                </form>
            </div>

            <div class="tab-pane fade" id="tab-kesenian">
                <h4>Tambah Galeri Kesenian</h4>
                <form id="formKesenian" class="mb-4">
                    <div class="row">
                        <div class="col-md-5">
                            <input type="text" id="artsNama" class="form-control"
                                placeholder="Nama Kesenian (Cth: Jathilan)" required>
                        </div>
                        <div class="col-md-5">
                            <input type="text" id="artsLink" class="form-control" placeholder="Link Embed Youtube"
                                required>
                            <small class="text-muted">Contoh: https://www.youtube.com/embed/...</small>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100" id="btnSaveArts">Simpan</button>
                        </div>
                    </div>
                </form>

                <hr>
                <h5>Daftar Kesenian</h5>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>Nama Kesenian</th>
                                <th>Tautan Youtube</th>
                                <th style="width: 100px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelKesenianBody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-kelompok">
                <h4>Tambah Kelompok Seni</h4>
                <form id="formKelompok" class="mb-4">
                    <div class="mb-2">
                        <label>Nama Kelompok/Sanggar</label>
                        <input type="text" id="groupNama" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>Deskripsi Singkat / Alamat</label>
                        <textarea id="groupDesc" class="form-control" rows="2" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success" id="btnSaveGroup">Simpan Kelompok</button>
                </form>

                <hr>
                <h5>Daftar Kelompok Seni</h5>
                <div class="table-responsive">
                    <table class="table table-bordered">
                        <thead class="table-success">
                            <tr>
                                <th>Nama Kelompok</th>
                                <th>Deskripsi</th>
                                <th style="width: 100px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelKelompokBody">
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="admin.js"></script>

</body>

</html>
